[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "furrow"
version = "0.1.0"
description = "Autonomous coding agent with infinite parallel development loop"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "anthropic>=0.34",
    "openai>=1.40",
    "httpx>=0.27",
    "click>=8.1",
    "rich>=13.7",
    "python-dotenv>=1.0",
    "aiofiles>=24.1",
    "tenacity>=8.2",
    "structlog>=24.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
furrow = "furrow.cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["furrow*"]
# Only regular packages (those with an __init__.py) are collected. This makes a
# missing __init__.py a visible packaging defect instead of silently shipping a
# PEP 420 namespace portion (or dropping the subpackage from the wheel entirely).
namespaces = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# E/W: pycodestyle (E501, W292, ...); F: pyflakes (F401/F841); I: isort;
# UP: pyupgrade (3.10 target); B: flake8-bugbear.
select = ["E", "F", "I", "UP", "B", "W"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
ignore_missing_imports = true
