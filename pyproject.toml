[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "furrow"
version = "0.1.0"
description = "Autonomous coding agent with infinite parallel development loop"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "anthropic>=0.34",
    "openai>=1.40",
    "httpx>=0.27",
    "click>=8.1",
    "rich>=13.7",
    "python-dotenv>=1.0",
    "aiofiles>=24.1",
    "tenacity>=8.2",
    "structlog>=24.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
furrow = "furrow.cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["furrow*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

# Explicit rule selection so behaviour does not drift between ruff releases.
# BLE and RUF are selected on purpose: the handful of deliberate blanket
# `except Exception` handlers in the loop, CLI, tester and websocket sender
# carry targeted `# noqa: BLE001` / `# noqa: RUF022` comments rather than a
# global ignore here, so each suppression stays visible at the call site.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "C4", "SIM", "RUF", "BLE", "TID", "ASYNC"]
# Long lines are left to the formatter and reviewers, not the linter.
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
files = ["furrow"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
# disallow_untyped_defs is intentionally off: several helpers take dynamic
# payloads and are annotated at the boundary only.
