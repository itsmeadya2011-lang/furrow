[build-system]
requires = ["setuptools>=68", "wheel"]
# "setuptools.backends.legacy" does not exist in setuptools>=68; the PEP 517
# backend module is setuptools.build_meta.
build-backend = "setuptools.build_meta"

[project]
name = "furrow"
version = "0.1.0"
description = "Autonomous coding agent with infinite parallel development loop"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "anthropic>=0.34",
    "openai>=1.40",
    "httpx>=0.27",
    "click>=8.1",
    "rich>=13.7",
    "python-dotenv>=1.0",
    "aiofiles>=24.1",
    "tenacity>=8.2",
    "structlog>=24.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
furrow = "furrow.cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
# Requires every subpackage (furrow.cli included) to have an __init__.py;
# namespace-only dirs are skipped by find(), so a wheel would ship no CLI.
include = ["furrow*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
# The in-repo .venv/ holds thousands of site-packages files; without this every
# `ruff check .` scans the entire installed dependency tree and floods output.
extend-exclude = [".venv"]

[tool.ruff.lint]
# Pin the rule set explicitly so findings are governed by a deliberate choice
# instead of ruff's changing defaults: pycodestyle/pyflakes basics, import order,
# pyupgrade, bugbear, comprehensions and simplifications.
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["furrow", "tests"]

[tool.mypy]
python_version = "3.10"
# anthropic, openai and aiofiles ship no type information (py.typed is absent),
# so imports of those SDKs would otherwise be hard errors.
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
exclude = ["^\\.venv/"]
