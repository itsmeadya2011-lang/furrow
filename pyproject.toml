[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "furrow"
version = "0.1.0"
description = "Autonomous coding agent with infinite parallel development loop"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "anthropic>=0.34",
    "openai>=1.40",
    "httpx>=0.27",
    "click>=8.1",
    "rich>=13.7",
    "aiofiles>=24.1",
    "tenacity>=8.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
furrow = "furrow.cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["furrow*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
filterwarnings = [
    # Third-party deprecation noise (HTTP/LLM SDKs, pydantic, starlette, anyio)
    # must never turn into a test failure.
    "ignore::DeprecationWarning:anthropic|openai|httpx|pydantic|pydantic_settings|fastapi|starlette|anyio|uvicorn",
    "ignore::PendingDeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Re-export modules: imports listed in __all__ are intentional side effects.
"**/__init__.py" = ["F401"]
# Tests may mutate sys.path before importing and use nested `with` blocks.
"tests/*" = ["E402", "SIM117"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
# Tests are intentionally loosely typed; only the library is held to strict typing.
module = "tests.*"
disallow_untyped_defs = false