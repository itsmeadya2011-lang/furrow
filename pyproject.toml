[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta:__legacy__"

[project]
name = "furrow"
version = "0.1.0"
description = "Autonomous coding agent with infinite parallel development loop"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "anthropic>=0.34",
    "openai>=1.40",
    "httpx>=0.27",
    "click>=8.1",
    "rich>=13.7",
    "python-dotenv>=1.0",
    "aiofiles>=24.1",
    "tenacity>=8.2",
    "structlog>=24.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
furrow = "furrow.cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["furrow*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
# Stale copies of the package produced by `setup.py build` / `pip install .`;
# they are build output, not source, and drift from the files under furrow/.
extend-exclude = ["build"]

[tool.ruff.lint]
# Deliberate, opinionated-but-sane rule set. Without an explicit `select` here
# plain `ruff check .` only ran the default E4,E7,E9,F, so different people
# passed different ad-hoc `--select` flags and reported wildly different counts.
#
# S (bandit), BLE, TRY and N are intentionally NOT selected: this codebase uses
# broad `except Exception` and `try/except/pass` as deliberate policy (a broken
# observer or a failed test run must be reported, never raised or silently
# skipped), and enforcing those families produces noise, not quality.
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RET", "ARG"]

[tool.ruff.lint.per-file-ignores]
# server.py embeds the whole single-page console (HTML + CSS + JS) in one raw
# string literal. Those long lines are markup, not Python; reflowing them to
# fit Python's line budget would only change what the browser renders. E501 is
# ignored for this file only, every other rule still applies.
"furrow/web/server.py" = ["E501"]
# Test doubles must mirror production signatures exactly, so an unused parameter
# there is structural rather than a defect. Renaming one to `_`-prefix to satisfy
# ARG actively breaks the suite: production passes `model=` as a keyword argument,
# so renaming `model` to `_model` breaks binding outright.
"tests/*" = ["ARG"]

[tool.ruff.lint.isort]
known-first-party = ["furrow"]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
# The third-party SDKs this project calls (anthropic, openai, tenacity) ship no
# type information, so their attribute access is unchecked rather than `Any`-ed
# away by hand-written stubs that would drift.
ignore_missing_imports = true
exclude = ["^tests/"]
